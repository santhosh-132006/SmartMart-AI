<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartMart AI – Supermarket Sales & Inventory Copilot</title>
  <meta http-equiv="refresh" content="0; url=frontend/dist/" />
  <script>
    // Immediately redirect to the SmartMart AI web application preserving query parameters & hash
    window.location.replace("frontend/dist/" + window.location.search + window.location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      border-radius: 14px;
      color: #16a34a;
      margin-bottom: 1.25rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.25rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.35rem;
    }
    h1 span {
      color: #16a34a;
    }
    p {
      color: #64748b;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.7rem 1.4rem;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.875rem;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.29 3.07-1.42 1.43M17 13l2.29 3.07 1.42 1.43M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
      </svg>
    </div>
    <h1>Smart<span>Mart</span> AI</h1>
    <p>Opening Supermarket Sales &amp; Inventory Copilot...</p>
    <div class="spinner"></div>
    <a href="frontend/dist/" class="btn">Launch Application Directly</a>
  </div>
</body>
</html>
